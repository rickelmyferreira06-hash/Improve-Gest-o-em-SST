name: Gerar bibliotecas PHP do Improve SST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar-bibliotecas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Preparar PHP 8.1 e Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, gd, dom, openssl, sodium
          tools: composer:v2
          coverage: none

      - name: Criar a lista de dependencias do site
        shell: bash
        run: |
          mkdir -p improve-site-libs
          cat > improve-site-libs/composer.json <<'JSON'
          {
            "name": "improve/sst-nc-email",
            "description": "Dependencias PHP do Improve SST Online para EPI e documentos",
            "require": {
              "php": "^8.1",
              "ext-mbstring": "*",
              "ext-gd": "*",
              "ext-dom": "*",
              "phpmailer/phpmailer": "^6.9",
              "dompdf/dompdf": "^3.1",
              "lbuchs/webauthn": "^2.2",
              "endroid/qr-code": "^5.0"
            }
          }
          JSON

      - name: Instalar bibliotecas
        working-directory: improve-site-libs
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Verificar autoload
        working-directory: improve-site-libs
        run: php -r "require 'vendor/autoload.php'; echo 'Autoload OK'.PHP_EOL;"

      - name: Empacotar pasta vendor
        working-directory: improve-site-libs
        shell: bash
        run: zip -qr "$GITHUB_WORKSPACE/Improve-SST-vendor.zip" vendor composer.lock

      - name: Disponibilizar bibliotecas para download
        uses: actions/upload-artifact@v4
        with:
          name: Improve-SST-Bibliotecas-PHP
          path: Improve-SST-vendor.zip
          if-no-files-found: error
          retention-days: 7
