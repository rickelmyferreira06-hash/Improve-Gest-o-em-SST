plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.improveengenhariasst.online'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.improveengenhariasst.online'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            // Nunca mantenha senhas nem chaves privadas neste repositorio.
            if (System.getenv('IMPROVE_KEYSTORE_PATH')
                    && System.getenv('IMPROVE_KEYSTORE_PASSWORD')
                    && System.getenv('IMPROVE_KEY_ALIAS')
                    && System.getenv('IMPROVE_KEY_PASSWORD')) {
                storeFile file(System.getenv('IMPROVE_KEYSTORE_PATH'))
                storePassword System.getenv('IMPROVE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('IMPROVE_KEY_ALIAS')
                keyPassword System.getenv('IMPROVE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('IMPROVE_KEYSTORE_PATH')
                    && System.getenv('IMPROVE_KEYSTORE_PASSWORD')
                    && System.getenv('IMPROVE_KEY_ALIAS')
                    && System.getenv('IMPROVE_KEY_PASSWORD')) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-teste'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
