name: Gerar APK Improve SST Online

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMPROVE_KEYSTORE_BASE64: ${{ secrets.IMPROVE_KEYSTORE_BASE64 }}
      IMPROVE_KEYSTORE_PASSWORD: ${{ secrets.IMPROVE_KEYSTORE_PASSWORD }}
      IMPROVE_KEY_ALIAS: ${{ secrets.IMPROVE_KEY_ALIAS }}
      IMPROVE_KEY_PASSWORD: ${{ secrets.IMPROVE_KEY_PASSWORD }}
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Gerar APK de teste
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Disponibilizar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: Improve-SST-Android-Teste
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Gerar APK definitivo se a assinatura estiver configurada
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${IMPROVE_KEYSTORE_BASE64}" || -z "${IMPROVE_KEYSTORE_PASSWORD}" || -z "${IMPROVE_KEY_ALIAS}" || -z "${IMPROVE_KEY_PASSWORD}" ]]; then
            echo 'Assinatura nao configurada: somente APK de teste foi gerado.'
            exit 0
          fi
          export IMPROVE_KEYSTORE_PATH="$RUNNER_TEMP/improve-release.jks"
          printf '%s' "$IMPROVE_KEYSTORE_BASE64" | base64 --decode > "$IMPROVE_KEYSTORE_PATH"
          chmod 600 "$IMPROVE_KEYSTORE_PATH"
          gradle --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Improve-SST.apk
          rm -f "$IMPROVE_KEYSTORE_PATH"

      - name: Disponibilizar APK definitivo assinado
        uses: actions/upload-artifact@v4
        with:
          name: Improve-SST-Android-Definitivo
          path: app/build/outputs/apk/release/Improve-SST.apk
          if-no-files-found: ignore
          retention-days: 30
